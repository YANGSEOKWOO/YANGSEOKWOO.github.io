<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  {% include header.html %}
  <main class="container">
    {{ content }}
  </main>
  {% include footer.html %}

  <!-- Mermaid: kramdown이 ```mermaid 코드블록을 .language-mermaid 로 렌더 → div.mermaid 로 바꿔 렌더 -->
  <script type="module">
    const blocks = document.querySelectorAll('.language-mermaid');
    if (blocks.length) {
      blocks.forEach((block) => {
        const code = block.querySelector('code') || block;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent.replace(/\n$/, '');
        block.replaceWith(div);
      });
      const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
      mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' });
      await mermaid.run();
    }
  </script>
</body>
</html>
